name: Deploy to Snowflake (SnowCLI)

on:
  push:
    branches:
      - dev  # or dev, as needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python & Install Snowflake CLI
        run: |
          python3 -m pip install --upgrade pip
          pip install snowflake-cli-labs
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Snowflake Deployment (Hardcoded Credentials)
        env:
          SNOWFLAKE_ACCOUNT: LNVIESZ-AKB04277
          SNOWFLAKE_USERNAME: STRAINING
          SNOWFLAKE_PASSWORD: SuperGoodluck2025
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWFLAKE_WAREHOUSE: COMPUTE_WH
          SNOWFLAKE_DATABASE: TEST
          SNOWFLAKE_SCHEMA: TEST_SCH
        run: |
          mkdir -p ~/.snowflake
          cat <<EOF > ~/.snowflake/config.toml
          [default]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "${SNOWFLAKE_USERNAME}"
          password = "${SNOWFLAKE_PASSWORD}"
          role = "${SNOWFLAKE_ROLE}"
          warehouse = "${SNOWFLAKE_WAREHOUSE}"
          database = "${SNOWFLAKE_DATABASE}"
          schema = "${SNOWFLAKE_SCHEMA}"
          EOF

          echo "🔁 Running deploy script..."
          snow sql run --file scripts/main_deploy.sql --environment default
