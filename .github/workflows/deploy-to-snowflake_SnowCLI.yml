name: Deploy to Snowflake (SnowCLI)

on:
  push:
    branches:
      - dev  # Trigger on push to dev branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python & Install Snowflake CLI
        run: |
          python3 -m pip install --upgrade pip
          pip install snowflake-cli-labs
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Snowflake Deployment (Hardcoded Credentials)
        env:
          SNOWFLAKE_ACCOUNT: SPHEUCZ-HQ66596
          SNOWFLAKE_USERNAME: SFTRAINING
          SNOWFLAKE_PASSWORD: GoodSuperluck@025
          SNOWFLAKE_ROLE: ACCOUNTADMIN
          SNOWFLAKE_WAREHOUSE: COMPUTE_WH
          SNOWFLAKE_DATABASE: SFTRAINING_EMP_DB
          SNOWFLAKE_SCHEMA: EMP_HR
        run: |
          set -x
          mkdir -p ~/.snowflake
          cat <<EOF > ~/.snowflake/config.toml
          [default]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "${SNOWFLAKE_USERNAME}"
          password = "${SNOWFLAKE_PASSWORD}"
          role = "${SNOWFLAKE_ROLE}"
          warehouse = "${SNOWFLAKE_WAREHOUSE}"
          database = "${SNOWFLAKE_DATABASE}"
          schema = "${SNOWFLAKE_SCHEMA}"
          EOF
          chmod 0600 ~/.snowflake/config.toml

          echo "📄 Snowflake config file:"
          cat ~/.snowflake/config.toml

          echo "🔁 Running deploy script..."
          snow sql --config ~/.snowflake/config.toml --filename scripts/main_deploy.sql --environment default || echo "❌ Snow SQL failed"
