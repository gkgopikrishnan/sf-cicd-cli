name: Deploy to Snowflake (SnowCLI)

on:
  push:
    branches:
      - dev  # Trigger on push to dev branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python & Install Snowflake CLI
        run: |
          set -x
          python3 -m pip install --upgrade pip
          pip install snowflake-cli-labs
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          hash -r  # Refresh shell path
          snow --version || echo "Snow CLI not found"

      - name: Print all Snowflake env vars for debug (masked password)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          set -x
          echo "🛠 Snowflake Environment Variables:"
          echo "SNOWFLAKE_ACCOUNT=$SNOWFLAKE_ACCOUNT"
          echo "SNOWFLAKE_USERNAME=$SNOWFLAKE_USERNAME"
          echo "SNOWFLAKE_PASSWORD=********"  # Masked for security
          echo "SNOWFLAKE_ROLE=$SNOWFLAKE_ROLE"
          echo "SNOWFLAKE_WAREHOUSE=$SNOWFLAKE_WAREHOUSE"
          echo "SNOWFLAKE_DATABASE=$SNOWFLAKE_DATABASE"
          echo "SNOWFLAKE_SCHEMA=$SNOWFLAKE_SCHEMA"

      - name: Show deployment script info
        run: |
          set -x
          echo "📄 Deployment SQL script info:"
          ls -lh scripts/main_deploy.sql || (echo "❌ Script not found" && exit 1)
          echo "--- First 20 lines of deployment script ---"
          head -n 20 scripts/main_deploy.sql || echo "(File missing or empty)"
          echo "-----------------------------------------"

      - name: Run Snowflake Deployment (using secrets as env)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          set -x
          echo "🔁 Running Snowflake deploy script via Snow CLI..."

          snow sql \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USERNAME" \
            --role "$SNOWFLAKE_ROLE" \
            --warehouse "$SNOWFLAKE_WAREHOUSE" \
            --database "$SNOWFLAKE_DATABASE" \
            --schema "$SNOWFLAKE_SCHEMA" \
            --filename scripts/main_deploy.sql
          ret=$?
          echo "Snowflake CLI exit code: $ret"
          if [ $ret -ne 0 ]; then
            echo "❌ Snowflake CLI execution failed"
            exit $ret
          else
            echo "✅ Snowflake CLI executed successfully"
          fi
