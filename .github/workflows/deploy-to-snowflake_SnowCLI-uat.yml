name: Deploy to Snowflake (SnowCLI)

on:
  push:
    branches:
      - uat  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python & Install Snowflake CLI
        run: |
          set -x
          python3 -m pip install --upgrade pip
          pip install snowflake-cli-labs
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          hash -r  # Refresh shell path
          snow --version || echo "Snow CLI not found"

      - name: Print all Snowflake env vars for debug (masked password)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.UAT_SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USERNAME: ${{ secrets.UAT_SNOWFLAKE_USERNAME }}
          SNOWFLAKE_PASSWORD: ${{ secrets.UAT_SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.UAT_SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.UAT_SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.UAT_SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.UAT_SNOWFLAKE_SCHEMA }}
        run: |
          set -x
          echo "🛠 Snowflake Environment Variables:"
          echo "SNOWFLAKE_ACCOUNT=$UAT_SNOWFLAKE_ACCOUNT"
          echo "SNOWFLAKE_USERNAME=$UAT_SNOWFLAKE_USERNAME"
          echo "SNOWFLAKE_PASSWORD=********"  # Masked for security
          echo "SNOWFLAKE_ROLE=$UAT_SNOWFLAKE_ROLE"
          echo "SNOWFLAKE_WAREHOUSE=$UAT_SNOWFLAKE_WAREHOUSE"
          echo "SNOWFLAKE_DATABASE=$UAT_SNOWFLAKE_DATABASE"
          echo "SNOWFLAKE_SCHEMA=$UAT_SNOWFLAKE_SCHEMA"

      - name: Show deployment script info
        run: |
          set -x
          echo "📄 Deployment SQL script info:"
          ls -lh scripts/main_deploy.sql || (echo "❌ Script not found" && exit 1)
          echo "--- First 20 lines of deployment script ---"
          head -n 20 scripts/main_deploy.sql || echo "(File missing or empty)"
          echo "-----------------------------------------"

      - name: Create snowflake config file with default connection profile
        run: |
          mkdir -p ~/.snowflake
          cat <<EOF > ~/.snowflake/config.toml
          [connections.default]
          account = "${{ secrets.UAT_SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.UAT_SNOWFLAKE_USERNAME }}"
          password = "${{ secrets.UAT_SNOWFLAKE_PASSWORD }}"
          role = "${{ secrets.UAT_SNOWFLAKE_ROLE }}"
          warehouse = "${{ secrets.UAT_SNOWFLAKE_WAREHOUSE }}"
          database = "${{ secrets.UAT_SNOWFLAKE_DATABASE }}"
          schema = "${{ secrets.UAT_SNOWFLAKE_SCHEMA }}"
          EOF
          chmod 600 ~/.snowflake/config.toml

      - name: Run Snowflake Deployment using connection profile
        run: |
          set -x
          echo "🔁 Running Snowflake deploy script via Snow CLI with connection profile..."

          snow sql --connection default --filename scripts/main_deploy.sql
          ret=$?
          echo "Snowflake CLI exit code: $ret"
          if [ $ret -ne 0 ]; then
            echo "❌ Snowflake CLI execution failed"
            exit $ret
          else
            echo "✅ Snowflake CLI executed successfully"
          fi
